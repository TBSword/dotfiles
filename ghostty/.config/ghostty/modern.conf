# 与 kitty 对齐：字号、padding、透明度、光标、复制行为
# scrollback-limit 单位是字节，采用 10 MB 作为与 kitty 滚动历史相近的配置
font-size = 12
window-padding-x = 10
window-padding-y = 10
scrollback-limit = 10000000
copy-on-select = true
confirm-close-surface = false
shell-integration = detect
background-opacity = 0.7
cursor-style = block
mouse-hide-while-typing = true
