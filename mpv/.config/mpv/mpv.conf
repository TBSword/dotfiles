# 字幕带半透明黑底背景，解决 PPT 视频中字幕与画面文字重叠问题
sub-back-color=0.0/0.0/0.0/0.6

# 强制 ASS/SSA 字幕应用用户样式
sub-ass-override=force

# 描边
sub-border-size=2.5
sub-border-color=0.0/0.0/0.0

# 阴影
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0

# 字体大小
sub-font-size=46

# 底部边距，离画面下边缘留一点空间
sub-margin-y=10

# 设定截图存储位置
screenshot-directory=~/Pictures/mpv
