# Better prefix (Ctrl+a instead of Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window inherits current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Join window as pane (C-a J, then enter source window number)
bind J command-prompt -p "join from window: " "join-pane -s ':%%'"

# Vi mode in copy/scroll
setw -g mode-keys vi

# Faster escape key (fixes vim/neovim delay)
set -sg escape-time 0

# Mouse support
set -g mouse on

# Start windows/panes at 1 not 0
set -g base-index 1
setw -g pane-base-index 1

# Auto-renumber windows when one is closed
set -g renumber-windows on

# Prevent apps (nvim, etc.) from renaming tmux windows
set -g allow-rename off

# Increase scrollback
set -g history-limit 10000

# Reload config with prefix+r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Activity monitoring (flash on background window output)
setw -g monitor-activity on
set -g visual-activity on

# 256 colors and true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# === Plugins ===

# tmux-resurrect: save/restore tmux environment
#  prefix + Ctrl-s : save
#  prefix + Ctrl-r : restore
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'

# tmux-continuum: auto-save every 5 minutes + auto-restore on start
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'
run '~/.tmux/plugins/tmux-continuum/continuum.tmux'
source-file -q ~/.config/tmux/modern.conf
